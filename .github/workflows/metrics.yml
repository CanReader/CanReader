name: GitHub Metrics

on:
  schedule:
    # 04:30 Istanbul (UTC+3) == 01:30 UTC, daily
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Coding habits and lines changed
        uses: lowlighter/metrics@v3.34
        with:
          # metrics requires a personal access token; the built-in token can only
          # commit the result, which is what committer_token defaults to.
          token: ${{ secrets.STATS_TOKEN }}
          user: CanReader
          filename: metrics.habits.svg
          template: classic
          base: ""                       # skip base cards, already covered elsewhere in the README
          config_timezone: Europe/Istanbul

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          plugin_lines: yes
          plugin_lines_sections: base

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public
