name: Contribution Snake

on:
  schedule:
    # 05:00 Istanbul (UTC+3) == 02:00 UTC, daily
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # built-in token is enough; snk only reads the public contribution calendar
          outputs: |
            snake/github-snake.svg
            snake/github-snake-dark.svg?palette=github-dark

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A snake
          if git commit -m "chore: regenerate contribution snake"; then
            git push
          fi
